name: release

on:
  push:
    branches:
      - master
  # Von Hand anstoßbar, falls ein Lauf hängen bleibt.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  # Schlägt den Release als PR vor und taggt beim Merge. Der Bot und nicht der
  # Default-GITHUB_TOKEN, sonst lösen die Commits des Release-PRs keine Workflows aus.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Gebaut wird erst, wenn ein Release wirklich entstanden ist: vier Tauri-Builds
  # auf jeden Push wären Minuten für ein Artefakt, das niemand lädt.
  build-tauri:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon und Intel getrennt: ein Universal-Binary wäre ein drittes
          # Artefakt, das niemand von beiden ist.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build & upload binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Die Tauri-App liegt nicht im Repo-Wurzelverzeichnis, sondern ist eine von zweien.
          projectPath: apps/harbor
          tagName: ${{ needs.release-please.outputs.tag_name }}
          args: ${{ matrix.args }}
