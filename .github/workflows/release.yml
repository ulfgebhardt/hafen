name: release

on:
  push:
    branches:
      - master
  # Von Hand anstoßbar, falls ein Lauf hängen bleibt.
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  # Schlägt den Release als PR vor und taggt beim Merge. Der Bot und nicht der
  # Default-GITHUB_TOKEN, sonst lösen die Commits des Release-PRs keine Workflows aus.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  # Gebaut wird erst, wenn ein Release wirklich entstanden ist: fünf Tauri-Builds
  # auf jeden Push wären Minuten für ein Artefakt, das niemand lädt.
  build-tauri:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon und Intel getrennt: ein Universal-Binary wäre ein drittes
          # Artefakt, das niemand von beiden ist.
          #
          # Beide ad-hoc signiert (`bundle.macOS.signingIdentity: "-"` in tauri.conf.json).
          # Ohne das trug nur das Binary die Linker-Signatur, nicht das Bundle um es herum, und
          # Apple Silicon verlangt eine gültige: aarch64 aus einem Download meldete am 04.10.2026
          # „Hafen.app ist beschädigt“, ohne Ausweg, während x64 unter Rosetta startete. Ad-hoc
          # heißt „unverifizierter Entwickler“ statt „beschädigt“ -- öffnen lässt es sich unter
          # Datenschutz & Sicherheit. Ohne jede Warnung ginge es nur mit Developer ID und
          # Notarisierung, und das ist eine eigene Entscheidung.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          # Linux arm64 auf dem eigenen Runner statt kreuzkompiliert: webkit2gtk und die
          # Bundler (deb, rpm, AppImage) wollen ein arm64-System, und 22.04 wie beim x64-Build,
          # damit beide gegen dieselbe glibc gebaut sind.
          - platform: ubuntu-22.04-arm
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # @v0 und nicht @v1, und das ist Absicht.
      #
      # v1 ist seit 29.06.2026 draussen und hat `includeUpdaterJson` in
      # `uploadUpdaterJson` umbenannt. Unbekannte Eingaben verwirft GitHub Actions mit
      # einer Warnung -- ein Upgrade der Major ohne Umbenennen wuerde also bauen,
      # gruen sein und die `latest.json` einfach nicht hochladen. Genau der stille
      # Fehler, gegen den die Quest `auslauf/aktualisierung` geschrieben ist, und sie
      # faende ihn hier *nicht*: sie sucht die Zeichenkette, und die steht dann noch da.
      #
      # Wer auf v1 geht, benennt mit: `includeUpdaterJson` -> `uploadUpdaterJson`,
      # `assetNamePattern` -> `releaseAssetNamePattern` (hier nicht gesetzt), und zieht
      # den Text der Quest nach.
      - name: Build & upload binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ohne ihn entstehen keine .sig-Dateien, und ohne Signatur installiert der Updater
          # nichts: der Schlüssel ist nicht die Absicherung des Releases, sondern die Bedingung,
          # dass es beim Nutzer ankommt.
          #
          # Fehlt er, **bricht der Build ab** -- gemessen am 02.10.2026 lokal, nachdem hier das
          # Gegenteil gestanden hatte: `tauri build` mit `createUpdaterArtifacts` und einem
          # pubkey endet mit "A public key has been found, but no private key". Das ist der
          # freundliche der beiden Fehler, weil er nicht zu uebersehen ist.
          #
          # Ein Passwort gibt es nicht, und das ist eine Entscheidung. Es landete in der CI im
          # *selben* Secret-Speicher wie der Schlüssel, also schützte es dort nichts -- wer eins
          # lesen kann, liest beide. Lokal hätte es nur geschützt, wenn es nicht neben dem
          # Schlüssel liegt, und dann wäre es eine zweite verlierbare Hälfte an etwas, das sich
          # nicht ersetzen lässt. `tauri signer sign` nimmt ein leeres Passwort ausdrücklich an.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # Die Tauri-App liegt nicht im Repo-Wurzelverzeichnis, sondern ist eine von zweien.
          projectPath: apps/harbor
          tagName: ${{ needs.release-please.outputs.tag_name }}
          args: ${{ matrix.args }}
          # Die Datei, die ein laufendes Binary fragt. Jeder der fünf Jobs ergänzt seine
          # Plattform in derselben `latest.json` -- sie wird gelesen und zurückgeschrieben,
          # nicht überschrieben, sonst kennte das Release nur die Plattform, die zuletzt
          # fertig wurde.
          includeUpdaterJson: true
