name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Laufende Runs bei neuem Push auf denselben Branch abbrechen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Derselbe Vertrag, den `CLAUDE.md` nennt: `pnpm test:lint` und `pnpm test:unit`.
  # Keine eigene Kommandoliste hier — eine zweite Wahrheit darüber, was grün heißt,
  # ist genau die, die auseinanderläuft.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Linter und vue-tsc über alle Pakete.
      - name: test:lint
        run: pnpm test:lint

      # vitest mit den Coverage-Schwellen aus den vitest.config.ts.
      - name: test:unit
        run: pnpm test:unit

      # Das Fenster muss sich auch bauen lassen: `generate_context!` bettet `dist/` ein,
      # ein kaputter Build fiele sonst erst im Release auf.
      - name: Build frontend
        run: pnpm --filter @hafen/harbor build

  rust:
    strategy:
      fail-fast: false
      # Drei Plattformen, weil für drei released wird. Der Rust-Teil ist reines std —
      # es gibt keinen #[cfg]-Zweig, der nur auf einer davon kompiliert, und genau das
      # ist die Aussage, die hier nachgewiesen wird.
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!` bettet das Frontend (frontendDist=../dist) zur
      # Compile-Zeit ein — dist/ ist gitignored, also hier bauen.
      - name: Build frontend
        run: pnpm --filter @hafen/harbor build

      - name: Format check
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo clippy --locked --all-targets -- -D warnings

      # --locked: eine Cargo.lock, die nicht zur Cargo.toml passt, ist rot statt still
      # repariert. So blieb das Release 1.0.0 unbemerkt: release-please hob Cargo.toml an,
      # die Lock-Datei nicht, und jeder lokale Lauf schrieb sie danach um.
      - name: Test
        run: cargo test --locked
